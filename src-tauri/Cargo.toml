[package]
name = "mad-toolbox"
version = "1.2.0"
description = "A GUI toolbox for BBDown, yt-dlp, FFmpeg and MediaInfo"
authors = ["MAD Toolbox Contributors"]
license = "MIT"
repository = "https://github.com/MAD-Toolbox/MAD-Toolbox"
edition = "2021"

[lib]
name = "mad_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
reqwest = { version = "0.13", features = ["cookies", "json"] }
minisign-verify = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust-i18n = "3"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
