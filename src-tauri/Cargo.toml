[package]
name = "mad-toolbox"
version = "0.5.12"
description = "A GUI toolbox for BBDown, yt-dlp, FFmpeg and MediaInfo"
authors = ["MAD Toolbox Contributors"]
license = "MIT"
repository = "https://github.com/MAD-Toolbox/MAD-Toolbox"
edition = "2021"

[lib]
name = "mad_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["cookies", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
