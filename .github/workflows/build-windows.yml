name: Build Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 ${{ matrix.edition }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Full
            build_script: tauri:build:full
          - edition: Lite
            build_script: tauri:build:lite

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-${{ matrix.edition }}

      - name: Install frontend packages
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build unsigned NSIS installer
        run: npm run ${{ matrix.build_script }} -- win --no-sign --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Verify installer output
        shell: pwsh
        run: |
          $Installers = @(Get-ChildItem -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File)
          if ($Installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($Installers.Count)."
          }
          Get-FileHash -LiteralPath $Installers[0].FullName -Algorithm SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: MAD-Toolbox-Windows-x64-${{ matrix.edition }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30
