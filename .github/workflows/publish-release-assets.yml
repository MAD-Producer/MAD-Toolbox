name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      target_sha: ${{ steps.release.outputs.target_sha }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: release
        name: Validate tag, versions and changelog
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z; received '$TAG'."
            exit 1
          fi

          version="${TAG#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $package_version."
            exit 1
          fi

          npm run version:check
          npm run --silent release:notes -- "$TAG" > release-notes.md
          test -s release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.platform }} ${{ matrix.edition }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            platform_id: windows
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            edition: Full
            build_script: tauri:build:full
          - platform: Windows x64
            platform_id: windows
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            edition: Lite
            build_script: tauri:build:lite
          - platform: macOS Apple Silicon
            platform_id: macos
            runner: macos-15
            rust_target: aarch64-apple-darwin
            edition: Full
            build_script: tauri:build:full
          - platform: macOS Apple Silicon
            platform_id: macos
            runner: macos-15
            rust_target: aarch64-apple-darwin
            edition: Lite
            build_script: tauri:build:lite

    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Confirm Apple Silicon runner
        if: matrix.platform_id == 'macos'
        run: test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform_id }}-${{ matrix.edition }}

      - name: Install frontend packages
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build Windows installer
        if: matrix.platform_id == 'windows'
        run: npm run ${{ matrix.build_script }} -- win --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build macOS image
        if: matrix.platform_id == 'macos'
        run: npm run ${{ matrix.build_script }} -- mac --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Verify Windows installer
        if: matrix.platform_id == 'windows'
        shell: pwsh
        run: |
          $Installers = @(Get-ChildItem -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File)
          $Signatures = @(Get-ChildItem -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe.sig" -File)
          if ($Installers.Count -ne 1 -or $Signatures.Count -ne 1) {
            throw "Expected exactly one Windows installer and signature; found $($Installers.Count) installer(s) and $($Signatures.Count) signature(s)."
          }
          Get-FileHash -LiteralPath $Installers[0].FullName -Algorithm SHA256

      - name: Verify macOS image
        if: matrix.platform_id == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_directory="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          app_directory="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          images=("$dmg_directory"/*.dmg)
          archives=("$app_directory"/*.app.tar.gz)
          signatures=("$app_directory"/*.app.tar.gz.sig)
          test -f "${images[0]}"
          test "${#images[@]}" -eq 1
          test -f "${archives[0]}"
          test "${#archives[@]}" -eq 1
          test -f "${signatures[0]}"
          test "${#signatures[@]}" -eq 1
          hdiutil verify "${images[0]}"

      - name: Upload Windows release files
        if: matrix.platform_id == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform_id }}-${{ matrix.edition }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS release files
        if: matrix.platform_id == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform_id }}-${{ matrix.edition }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0

      - name: Confirm tag has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_sha=$(git rev-list -n 1 "$TAG")
          if [ "$tag_sha" != "$TARGET_SHA" ]; then
            echo "::error::Tag $TAG moved from $TARGET_SHA to $tag_sha during the build."
            exit 1
          fi

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: staging

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          copy_single() {
            local directory="$1" pattern="$2" output="$3"
            local files=()
            mapfile -t files < <(find "$directory" -type f -name "$pattern")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one $pattern file in $directory, found ${#files[@]}."
              exit 1
            fi
            cp "${files[0]}" "dist/$output"
          }

          copy_single staging/release-windows-Full '*.exe' "MAD.Toolbox_${VERSION}_x64-Full-setup.exe"
          copy_single staging/release-windows-Lite '*.exe' "MAD.Toolbox_${VERSION}_x64-Lite-setup.exe"
          copy_single staging/release-windows-Full '*.exe.sig' "MAD.Toolbox_${VERSION}_x64-Full-setup.exe.sig"
          copy_single staging/release-windows-Lite '*.exe.sig' "MAD.Toolbox_${VERSION}_x64-Lite-setup.exe.sig"
          copy_single staging/release-macos-Full '*.dmg' "MAD.Toolbox_${VERSION}_aarch64-Full.dmg"
          copy_single staging/release-macos-Lite '*.dmg' "MAD.Toolbox_${VERSION}_aarch64-Lite.dmg"
          copy_single staging/release-macos-Full '*.app.tar.gz' "MAD.Toolbox_${VERSION}_aarch64-Full.app.tar.gz"
          copy_single staging/release-macos-Lite '*.app.tar.gz' "MAD.Toolbox_${VERSION}_aarch64-Lite.app.tar.gz"
          copy_single staging/release-macos-Full '*.app.tar.gz.sig' "MAD.Toolbox_${VERSION}_aarch64-Full.app.tar.gz.sig"
          copy_single staging/release-macos-Lite '*.app.tar.gz.sig' "MAD.Toolbox_${VERSION}_aarch64-Lite.app.tar.gz.sig"
          copy_single staging/release-notes 'release-notes.md' release-notes.md
          test "$(sha256sum third_party/source_archives/ffmpeg-8.1.2.tar.xz | awk '{print $1}')" = "$(jq -r '.tools[] | select(.name == "FFmpeg") | .artifactSha256' third_party/sources.json)"
          test "$(sha256sum third_party/source_archives/ffmpeg-9b6c8969e05b4f0b29f0f85cd501be6b3e582e6b.tar.gz | awk '{print $1}')" = "$(jq -r '.tools[] | select(.name == "FFmpeg and ffprobe") | .sourceArchiveSha256' third_party/windows-sources.json)"
          test "$(sha256sum third_party/source_archives/btbn-ffmpeg-builds-a99e8230.tar.gz | awk '{print $1}')" = "$(jq -r '.tools[] | select(.name == "FFmpeg and ffprobe") | .buildRecipeArchiveSha256' third_party/windows-sources.json)"
          cp third_party/source_archives/ffmpeg-8.1.2.tar.xz dist/
          cp third_party/source_archives/ffmpeg-9b6c8969e05b4f0b29f0f85cd501be6b3e582e6b.tar.gz dist/
          cp third_party/source_archives/btbn-ffmpeg-builds-a99e8230.tar.gz dist/
          mv dist/release-notes.md release-notes.md

          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          make_manifest() {
            local edition="$1" out="$2" win_sig_file="$3" mac_sig_file="$4"
            jq -n \
              --arg version "$VERSION" \
              --arg pub_date "$pub_date" \
              --arg win_url "$download_base/MAD.Toolbox_${VERSION}_x64-${edition}-setup.exe" \
              --arg win_sig "$(cat "$win_sig_file")" \
              --arg mac_url "$download_base/MAD.Toolbox_${VERSION}_aarch64-${edition}.app.tar.gz" \
              --arg mac_sig "$(cat "$mac_sig_file")" \
              '{version: $version, pub_date: $pub_date,
                platforms: {
                  "windows-x86_64": {signature: $win_sig, url: $win_url},
                  "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
                }}' > "$out"
          }

          make_manifest Full dist/latest-full.json \
            "dist/MAD.Toolbox_${VERSION}_x64-Full-setup.exe.sig" \
            "dist/MAD.Toolbox_${VERSION}_aarch64-Full.app.tar.gz.sig"
          make_manifest Lite dist/latest-lite.json \
            "dist/MAD.Toolbox_${VERSION}_x64-Lite-setup.exe.sig" \
            "dist/MAD.Toolbox_${VERSION}_aarch64-Lite.app.tar.gz.sig"

          (cd dist && sha256sum *.exe *.dmg *.app.tar.gz ffmpeg-*.tar.xz ffmpeg-*.tar.gz btbn-*.tar.gz > SHA256SUMS.txt)

          {
            printf '%s\n' \
              '## Downloads' \
              '' \
              '| | Full | Lite |' \
              '| --- | --- | --- |' \
              "| Windows x64 | [![Windows Full setup](https://img.shields.io/badge/Full-Setup.exe-0078D6?logo=windows)](${download_base}/MAD.Toolbox_${VERSION}_x64-Full-setup.exe) | [![Windows Lite setup](https://img.shields.io/badge/Lite-Setup.exe-0078D6?logo=windows)](${download_base}/MAD.Toolbox_${VERSION}_x64-Lite-setup.exe) |" \
              "| macOS Apple Silicon | [![macOS Full image](https://img.shields.io/badge/Full-Disk.dmg-000000?logo=apple)](${download_base}/MAD.Toolbox_${VERSION}_aarch64-Full.dmg) | [![macOS Lite image](https://img.shields.io/badge/Lite-Disk.dmg-000000?logo=apple)](${download_base}/MAD.Toolbox_${VERSION}_aarch64-Lite.dmg) |" \
              ''
            cat release-notes.md
          } > release-notes.final.md
          mv release-notes.final.md release-notes.md

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_is_draft=$(gh release view "$TAG" \
              --json isDraft \
              --jq .isDraft \
              --repo "$GITHUB_REPOSITORY")
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "MAD Toolbox $TAG" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
            release_is_draft=true
          fi

          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --title "MAD Toolbox $TAG" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" \
              --title "MAD Toolbox $TAG" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish OpenList mirror
        shell: bash
        env:
          OPENLIST_WEBDAV_URL: ${{ secrets.OPENLIST_WEBDAV_URL }}
          OPENLIST_USERNAME: ${{ secrets.OPENLIST_USERNAME }}
          OPENLIST_PASSWORD: ${{ secrets.OPENLIST_PASSWORD }}
        run: |
          set -euo pipefail
          : "${OPENLIST_WEBDAV_URL:?Missing OPENLIST_WEBDAV_URL secret}"
          : "${OPENLIST_USERNAME:?Missing OPENLIST_USERNAME secret}"
          : "${OPENLIST_PASSWORD:?Missing OPENLIST_PASSWORD secret}"

          target="${OPENLIST_WEBDAV_URL%/}"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "$OPENLIST_USERNAME:$OPENLIST_PASSWORD" \
            --request MKCOL "$target/v$VERSION")
          if [ "$status" != "201" ] && [ "$status" != "405" ]; then
            echo "::error::Could not create OpenList version directory (HTTP $status)."
            exit 1
          fi

          upload() {
            curl --fail --silent --show-error \
              --user "$OPENLIST_USERNAME:$OPENLIST_PASSWORD" \
              --upload-file "$1" "$2"
          }

          for file in dist/MAD.Toolbox_* dist/latest-*.json dist/SHA256SUMS.txt; do
            upload "$file" "$target/v$VERSION/$(basename "$file")"
          done
          upload dist/latest-full.json "$target/latest-full.json"
          upload dist/latest-lite.json "$target/latest-lite.json"
