name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Attach installers to release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Resolve latest artifact IDs
        shell: bash
        run: |
          set -euo pipefail
          resolve_artifact() {
            local artifact_name="$1"
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "${API_ROOT}/actions/artifacts?name=${artifact_name}&per_page=100" \
              | jq -r --arg name "${artifact_name}" '
                  [.artifacts[] | select(.name == $name)] | max_by(.created_at)
                  | if . == null then
                      "NOT_FOUND"
                    elif .expired then
                      "EXPIRED " + .created_at
                    else
                      "\(.id) \(.created_at)"
                    end'
          }

          map_artifact() {
            local artifact_name="$1" env_name="$2" resolved id created_at
            resolved=$(resolve_artifact "${artifact_name}")
            case "${resolved}" in
              NOT_FOUND)
                echo "::error::No artifact named ${artifact_name}. Have the build workflows finished?"
                exit 1
                ;;
              EXPIRED*)
                echo "::error::The newest ${artifact_name} artifact (created ${resolved#EXPIRED }) is expired. Re-run the build workflows."
                exit 1
                ;;
            esac
            read -r id created_at <<< "${resolved}"
            echo "${env_name}=${id}" >> "${GITHUB_ENV}"
            echo "Resolved ${artifact_name} -> artifact ${id} (created ${created_at})"
          }

          map_artifact MAD-Toolbox-Windows-x64-Full WINDOWS_FULL_ARTIFACT_ID
          map_artifact MAD-Toolbox-Windows-x64-Lite WINDOWS_LITE_ARTIFACT_ID
          map_artifact MAD-Toolbox-macOS-Apple-Silicon-Full MACOS_FULL_ARTIFACT_ID
          map_artifact MAD-Toolbox-macOS-Apple-Silicon-Lite MACOS_LITE_ARTIFACT_ID

      - name: Download CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/windows-full staging/windows-lite staging/macos-full staging/macos-lite dist

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl --fail --location --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "${API_ROOT}/actions/artifacts/${artifact_id}/zip" \
              --output "$output"
          }

          download_artifact "$WINDOWS_FULL_ARTIFACT_ID" /tmp/windows-full.zip
          download_artifact "$WINDOWS_LITE_ARTIFACT_ID" /tmp/windows-lite.zip
          download_artifact "$MACOS_FULL_ARTIFACT_ID" /tmp/macos-full.zip
          download_artifact "$MACOS_LITE_ARTIFACT_ID" /tmp/macos-lite.zip

          unzip -q /tmp/windows-full.zip -d staging/windows-full
          unzip -q /tmp/windows-lite.zip -d staging/windows-lite
          unzip -q /tmp/macos-full.zip -d staging/macos-full
          unzip -q /tmp/macos-lite.zip -d staging/macos-lite

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          windows_full=$(find staging/windows-full -type f -name '*.exe' -print -quit)
          windows_lite=$(find staging/windows-lite -type f -name '*.exe' -print -quit)
          windows_full_sig=$(find staging/windows-full -type f -name '*.exe.sig' -print -quit)
          windows_lite_sig=$(find staging/windows-lite -type f -name '*.exe.sig' -print -quit)
          macos_full=$(find staging/macos-full -type f -name '*.dmg' -print -quit)
          macos_lite=$(find staging/macos-lite -type f -name '*.dmg' -print -quit)
          macos_full_tar=$(find staging/macos-full -type f -name '*.app.tar.gz' -print -quit)
          macos_lite_tar=$(find staging/macos-lite -type f -name '*.app.tar.gz' -print -quit)
          macos_full_sig=$(find staging/macos-full -type f -name '*.app.tar.gz.sig' -print -quit)
          macos_lite_sig=$(find staging/macos-lite -type f -name '*.app.tar.gz.sig' -print -quit)
          for required in windows_full windows_lite windows_full_sig windows_lite_sig \
                          macos_full macos_lite macos_full_tar macos_lite_tar \
                          macos_full_sig macos_lite_sig; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing '${required}' artifact file. Updater assets (.sig / .app.tar.gz) are produced only when the build workflows run with TAURI_SIGNING_PRIVATE_KEY configured; re-run the build workflows."
              exit 1
            fi
          done

          # GitHub release assets replace spaces with dots in uploaded names.
          # Use the final names here so SHA256SUMS.txt is verifiable after
          # downloading assets from the release page.
          cp "$windows_full" "dist/MAD.Toolbox_${TAG#v}_x64-Full-setup.exe"
          cp "$windows_lite" "dist/MAD.Toolbox_${TAG#v}_x64-Lite-setup.exe"
          cp "$macos_full" "dist/MAD.Toolbox_${TAG#v}_aarch64-Full.dmg"
          cp "$macos_lite" "dist/MAD.Toolbox_${TAG#v}_aarch64-Lite.dmg"

          # 应用内更新（tauri-plugin-updater）产物与按安装版本区分的清单
          cp "$windows_full_sig" "dist/MAD.Toolbox_${TAG#v}_x64-Full-setup.exe.sig"
          cp "$windows_lite_sig" "dist/MAD.Toolbox_${TAG#v}_x64-Lite-setup.exe.sig"
          cp "$macos_full_tar" "dist/MAD.Toolbox_${TAG#v}_aarch64-Full.app.tar.gz"
          cp "$macos_lite_tar" "dist/MAD.Toolbox_${TAG#v}_aarch64-Lite.app.tar.gz"
          cp "$macos_full_sig" "dist/MAD.Toolbox_${TAG#v}_aarch64-Full.app.tar.gz.sig"
          cp "$macos_lite_sig" "dist/MAD.Toolbox_${TAG#v}_aarch64-Lite.app.tar.gz.sig"

          version="${TAG#v}"
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          make_manifest() {
            local edition="$1" out="$2" win_sig_file="$3" mac_sig_file="$4"
            jq -n \
              --arg version "$version" \
              --arg pub_date "$pub_date" \
              --arg win_url "$download_base/MAD.Toolbox_${version}_x64-${edition}-setup.exe" \
              --arg win_sig "$(cat "$win_sig_file")" \
              --arg mac_url "$download_base/MAD.Toolbox_${version}_aarch64-${edition}.app.tar.gz" \
              --arg mac_sig "$(cat "$mac_sig_file")" \
              '{version: $version, pub_date: $pub_date,
                platforms: {
                  "windows-x86_64": {signature: $win_sig, url: $win_url},
                  "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
                }}' > "$out"
          }
          make_manifest Full dist/latest-full.json "$windows_full_sig" "$macos_full_sig"
          make_manifest Lite dist/latest-lite.json "$windows_lite_sig" "$macos_lite_sig"

          (cd dist && shasum -a 256 *.exe *.dmg *.app.tar.gz > SHA256SUMS.txt)

      - name: Upload release assets
        shell: bash
        run: gh release upload "$TAG" dist/*.exe dist/*.exe.sig dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig dist/latest-full.json dist/latest-lite.json dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
