<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D1D20" media="(prefers-color-scheme: dark)" />
    <title>MAD Toolbox</title>
    <script>
      // 主题防闪：React 加载前按存储值（或系统偏好）设置 .dark（与 lib/theme.ts 同 key）
      try {
        var scheme =
          localStorage.getItem("mad-toolbox:color-scheme") ||
          localStorage.getItem("mantine-color-scheme-value") ||
          "light";
        var dark =
          scheme === "dark" ||
          (scheme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
